spring:
  application:
    name: user-service
  config:
    import: optional:file:.env[.properties]

  data:
    redis:
      port: 6379
      host: localhost
  cache:
    type: redis
    redis:
      time-to-live: 600000

  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  cloud:
    discovery:
      enabled: false
    loadbalancer:
      enabled: false

camunda.bpm.client:
  base-url: ${CAMUNDA_URL}
  lock-duration: 10000
  subscriptions:
    auth_service_create:
      variable-names: userRequest, user_id
  default-serialization-format: application/json

server:
  error:
    include-stacktrace: never
  port: 80

eureka:
  client:
    webclient:
      enabled: false